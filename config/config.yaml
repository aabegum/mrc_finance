# MRC Business Review Generator - Consolidated Configuration
# All settings in one file for easier management
# Created: 2026-03-27

# ════════════════════════════════════════════════════════════════════════════
# APPLICATION SETTINGS
# ════════════════════════════════════════════════════════════════════════════
APP:
  Name: "MRC Business Review Generator"
  Version: "2.0"
  Author: "MRC Finance Team"
  Created: "2026-03-27"
  Active_Theme: "premium"  # default or premium
  
  # Output file naming
  Output:
    Filename_Prefix: "MRC_Business_Review_"  # Auto-prefixed with YYMMDD from the source Excel filename
    Save_In_Excel_Folder: true  # Save PPTX in same folder as source Excel
    Create_Temps_Folder: true   # Create temps/ folder for chart PNGs
  
  # Temps folder for chart files
  Temps: 
    Folder_Name: "temps"
    Clean_After_Generate: true
  
  # Global number formatting settings
  Formatting:
    Abbreviate_Millions: false  # If true, numbers >= 1000k show as 'X.XM' on charts
    Chart_Decimals: 3          # Precision for chart 'M' labels (1 = 983.1M)
    Axis_Decimals: 0           # Precision for Y-axis and standard numbers
    Chart_Label_Hex: "#2B2D42" # Dark Blue-Gray (Inside segment labels)
    Chart_Total_Hex: "#1E3A8A" # Deep Sapphire Blue (Grand totals above bars)
    Chart_3D_Modern: false     # Enable modern pills/cylindrical gradients for bars
    Chart_3D_Classic: true     # Enable true tilted 3D bars (Excel-style)
    Chart_3D_Isometric: false   # Enable 2.5D right-side only extrusion
    Chart_Label_Halo: false    # Disable white outline for a cleaner look
    Chart_Label_Threshold: 0.5  # Show labels for visible segments (>0.5%)
    # Per-BU label threshold overrides (% of that BU chart's tallest bar).
    # Set lower for BUs with small segment values so their labels are not suppressed.
    BU_Label_Threshold:
      ENG:  0.5
      MC:   0.5
      TSI:  0.5
      NUC:  0.5 
    ABNS_Max_Projects: 0  # 0 means show all ABNS projects on the callout


