      Gray_Spine:
        Hex: "#CBD5E1"  # Light Steel Gray
        RGB: [203, 213, 225]
      Forest_Green:
        Hex: "#10B981"  # Forest Green
        RGB: [16, 185, 129]
        Name: "Forest Green"
      Amber_Gold:
        Hex: "#F59E0B"  # Amber Gold
        RGB: [245, 158, 11]
        Name: "Amber Gold"
      Deep_Rose:
        Hex: "#E11D48"  # Deep Rose
        RGB: [225, 29, 72]
        Name: "Deep Rose"
      Series_Palette:
        - "#0EA5E9"  # Sky Blue
        - "#8BBF44"  # Lime Green (MC)
        - "#F59E0B"  # Amber Gold
        - "#E11D48"  # Deep Rose
        - "#1E3A8A"  # Deep Sapphire
        - "#8B5CF6"  # Violet
        - "#06B6D4"  # Ocean Cyan
        - "#EC4899"  # Vivid Pink
    
    # Typography
    Typography:
      Font_Family: "Segoe UI"
      Font_Fallbacks:
