      Data_Even_Row:
        Background_Color: "#F4F6F9"
      Data_Text:
        Color: "#1E3A8A"
        Font_Size: 10
    
    # Layout elements
    Layout:
      Header_Bar:
        Height_Inches: 0.03
        Background_Color: "#E2E8F0"
      Divider:
        Color: "#E2E8F0"
        Width: 0.9
    
    # Thank you slide
    Thank_You_Slide:
      Accent_Bar_Height: 0.2
      Main_Text_Size: 80
      Main_Text_Weight: "bold"
      Main_Text_Color: "#1E3A8A"
      Subtitle_Text_Size: 12
      Subtitle_Text_Color: "#64748B"
    
    # Master slide setup
    Master_Slides:
      Slide_Width: 13.33
      Slide_Height: 7.50
      Blank_Layout_Index: 6
      Default_Font: "Segoe UI"
      Default_Font_Fallback: ["Inter", "Aptos", "Arial"]
    
    # Template components
    Components:
      Header_Bar:
        Height: 0.03
        Color: "#0EA5E9"
      Sidebar:
        Width: 4.5
        Color: "#1E3A8A"
      Title_Box:
        Font: "Segoe UI"
        Size: 28
        Weight: "bold"
        Color: "#1E3A8A"
      Subtitle_Box:
        Font: "Segoe UI"
        Size: 12
        Color: "#64748B"
      Table_Header:
        Background: "#1E3A8A"
        Text_Color: "#FFFFFF"
      Table_Data:
        Background_Odd: "#FFFFFF"
        Background_Even: "#F4F6F9"
        Text_Color: "#1E3A8A"
    
    # Creation options
    Creation:
      Overwrite_Existing: false
      Backup_Before_Create: true
      Verbose: true
      Validate_After_Create: true
    
    # Validation
    Validation:
      Check_File_Exists: true
      Check_File_Size_Min: 100000
      Check_Slide_Count_Min: 1
      Check_Writable: true
      Check_Loadable: true
    
    # Paths
    Paths:
      Template_Dir: "template"
      Template_Filename: "MRC_Business_Review_Template_Premium.pptx"
      Backup_Dir: "template/backups"
      Auto_Create_Dir: true


# ════════════════════════════════════════════════════════════════════════════
# WIP TABLE (Slide 7+)
# ════════════════════════════════════════════════════════════════════════════
WIP_Table:
  WIP_Slide_MaxRows: 10   # Max rows per WIP slide; extra rows go to slide 2
  WIP_Min_TL: 1000000     # Only include projects >= 1M TL WIP
  Font_Size:
    Header: 11      # Header row font size (pt)
    Data:   10.5    # Data row font size (pt)
    Total:  11      # Total row font size (pt)
  # Columns to display. Order here = order in table.
  # field: key from wip project dict (name, client, orig_currency, inv_oc, prod_oc, wip_tl)
  # width_pct: share of total table width (must sum to 1.0)
  # align: LEFT, CENTER, RIGHT
  Columns:
    - field: name
      header: "Project Name"
      width_pct: 0.32
      align: LEFT
    - field: client
      header: "Client"
      width_pct: 0.18
      align: LEFT
    - field: orig_currency
      header: "Currency"
      width_pct: 0.10
      align: CENTER
    - field: inv_oc
      header: "Total Invoice OC"
      width_pct: 0.15
      align: RIGHT
    - field: prod_oc
      header: "Total Prod OC"
      width_pct: 0.15
      align: RIGHT
    - field: wip_tl
      header: "WIP TL"
      width_pct: 0.10
      align: RIGHT


# ════════════════════════════════════════════════════════════════════════════
# BUSINESS UNIT COLORS
# These are used consistently across all BU charts regardless of active theme.
# Order must match: ENG, MC, T&SI, NUC
# ════════════════════════════════════════════════════════════════════════════
BU_Colors:
  # ENG:  "#00B4D8"  # Cyan
  # MC:   "#FF006E"  # Pink
  # TSI:  "#8338EC"  # Purple
  # NUC:  "#FFBE0B"  # Yellow  
  ENG:  "#0EA5E9"  # Sky Blue
  MC:   "#8BBF44"  # Lime Green
  TSI:  "#FAB611"  # Amber Gold
  NUC:  "#016B61"  # Teal

# How the 3 tiers (Order / Offer / Opp) are shaded from each BU's base color.
# Each tier adjusts Saturation and Brightness (Value) of the base HSV color.
# Order = full base color (no adjustment needed).
# Lower saturation = more washed out. Higher brightness = lighter.
BU_Shade_Tiers:
  # Minimum HSV brightness applied to the base color before tier multipliers.
  # Dark BU colors (e.g. NUC teal #016B61, V≈0.42) would otherwise produce
  # illegible dark bars even at the Opp tier. Floor lifts the base so all
  # three tiers produce readable shades. Has no effect on bright base colors.
  Base_Brightness_Floor: 0.62
  Order:
    Saturation_Multiplier: 1.0
    Brightness_Multiplier: 1.0
  Offer:
    Saturation_Multiplier: 0.45   # Noticeably washed-out mid-tint
    Brightness_Multiplier: 1.18
  Opp:
    Color: "#BBBBBB"              # Fixed gray — overrides HSV tinting for all BUs


