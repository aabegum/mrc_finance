    # Grouped chart styling
    Grouped_Chart:
      Group_Width: 0.8
      Bar_Alpha: 0.88
      Value_Label_Font_Size: 8
      Value_Label_Font_Weight: "bold"
      Value_Label_Offset_Percent: 1.2
    
    # Branding
    Branding:
      Company_Name: "MRC TÜRKİYE"
      Website: "www.mrc-international.com"
      Sidebar:
        Width_Inches: 4.5
        Background_Color: "#1E3A8A"
      Chart_Title_Separator: " — "
      Edition: "Premium Corporate Edition"
    
    # Callout box styling
    Callout_Box:
      Background_Color: "#F0F5FA"
      Border_Color: "#0EA5E9"
      Border_Width: 1.5
      Label_Font_Size: 9
      Label_Font_Color: "#64748B"
      Value_Font_Size: 13.5
      Value_Font_Color: "#1E3A8A"
      Value_Font_Weight: "bold"
      Space_After_Label: 0
      Space_After_Value: 5
      Padding_Horizontal: 0.13
      Padding_Vertical: 0.13
    
    # Table styling
    Table:
