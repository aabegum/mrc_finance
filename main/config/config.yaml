        RGB: [14, 165, 233]
        Name: "Sky Blue"
      Dark:
        Hex: "#1E3A8A"
        RGB: [30, 58, 138]
        Name: "Deep Sapphire Blue"
      White:
        Hex: "#FFFFFF"
        RGB: [255, 255, 255]
      Background:
        Hex: "#F4F6F9"  # Soft Grey-Blue
        RGB: [244, 246, 249]
        Name: "Soft Grey-Blue"
      Gray_Light:
        Hex: "#E2E8F0"  # Very Light Steel
        RGB: [226, 232, 240]
      Gray_Light_Blue:
